<body>
  <header>
    <h1>🌸 ÑukawaStudio</h1>
    <p><strong>Jacket Flowers corto</strong></p>
    <p>Perfecto para el día a día. Versátil, cómodo y lleno de personalidad.</p>
  </header>

  <main>
    <section class="producto-detalle">
      <div class="carrusel">
        <img id="producto-img" src="" alt="Producto" loading="lazy" />
        <div class="controles">
          <button type="button" onclick="cambiarImagen(-1)">←</button>
          <button type="button" onclick="cambiarImagen(1)">→</button>
        </div>
      </div>

      <p id="nombre-color" style="font-weight: bold; margin-top: 10px;"></p>

      <p>Explora los colores disponibles y encuentra el que más refleje tu esencia.</p>

      <label for="talla">Selecciona tu talla:</label>
      <select id="talla">
        <option value="">-- Selecciona --</option>
        <option value="XS">XS (Muy Pequeña)</option>
        <option value="S">S (Pequeña)</option>
        <option value="M">M (Mediana)</option>
        <option value="L">L (Grande)</option>
        <option value="XL">XL (Extra grande)</option>
        <option value="XXL">XXL (Doble Extra grande)</option>
      </select>

      <button type="button" class="boton" onclick="ordenarWhatsApp()">🛍️ Ordenar por WhatsApp</button>
      <a href="../index.html" class="boton">← Volver al inicio</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ÑukawaStudio · Jacket Flowers · Con amor desde Otavalo-Imbabura-Ecuador 🌿</p>
  </footer>

  <script>
    const extensiones = [".webp", ".png", ".jpg", ".jpeg"];
    const maxColores = 4;
    const producto = "jacket";
    let indice = 1;
    let imagenSeleccionada = "";

    const nombresColores = [
      "Camel",
      "Beige",
      "Negro",
      "Café"
    ];

    function cambiarImagen(direccion) {
      indice += direccion;
      if (indice > maxColores) indice = 1;
      if (indice < 1) indice = maxColores;
      cargarImagen(indice);
    }

    function cargarImagen(num) {
      const imgElement = document.getElementById("producto-img");
      const nombreColorElement = document.getElementById("nombre-color");
      const basePath = `../assets/images/${producto}/${producto}_color${num}`;
      probarExtension(basePath, 0, imgElement, nombreColorElement, num);
    }

    function probarExtension(basePath, index, imgElement, nombreColorElement, num) {
      if (index >= extensiones.length) {
        console.error("No se encontró una imagen válida para:", basePath);
        imgElement.alt = "Imagen no disponible";
        nombreColorElement.textContent = "";
        return;
      }

      const testSrc = basePath + extensiones[index];
      const testImg = new Image();

      testImg.onload = function() {
        imgElement.src = testSrc;
        imgElement.alt = `Jacket Flowers corto color ${nombresColores[num - 1]}`;
        nombreColorElement.textContent = `Color: ${nombresColores[num - 1]}`;
        imagenSeleccionada = testSrc;
      };

      testImg.onerror = function() {
        probarExtension(basePath, index + 1, imgElement, nombreColorElement, num);
      };

      testImg.src = testSrc;
    }

    function ordenarWhatsApp() {
      const talla = document.getElementById("talla").value;

      if (!talla) {
        alert("Por favor, selecciona una talla.");
        return;
      }

      const color = nombresColores[indice - 1];
      const numero = "593968604535";
      const urlImagen = `${window.location.origin}/${imagenSeleccionada.replace("../", "")}`;

      const mensaje = `Hola 👋, me interesa la Jacket Flowers corto de ÑukawaStudio.

Color: ${color}
Talla: ${talla}
Imagen del modelo: ${urlImagen}`;

      const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

      if (typeof fbq === 'function') {
        fbq('track', 'Contact', {
          content_name: 'Jacket Flowers corto',
          content_category: 'Jacket',
          value: 1,
          currency: 'USD',
          contact_method: 'whatsapp',
          page: window.location.pathname
        });
      }

      if (typeof gtag === 'function') {
        gtag('event', 'click_whatsapp_jacket', {
          event_category: 'conversion',
          event_label: 'Jacket - botón WhatsApp',
          color_seleccionado: color,
          talla_seleccionada: talla
        });
      }

      setTimeout(function() {
        window.open(url, "_blank");
      }, 500);
    }

    window.onload = function() {
      cargarImagen(indice);
    };
  </script>
